
name: CI Build

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master
    types: [opened, reopened, synchronize]

  workflow_dispatch:
    inputs:
      tag:
        description: Tag for manually running CI Build workflow
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  first_check:
    name: Code quality / Python 3.13 / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install project
        run: |
          python -m pip install --upgrade pip poetry
          poetry install

      - name: Test with coverage
        run: poetry run pytest --cov --cov-report term --cov-report xml --junitxml=xunit-result.xml

      - name: Correct coverage paths
        run: sed -i "s+$PWD/++g" coverage.xml

      - name: Check style with Prospector
        run: poetry run prospector -o grouped -o pylint:pylint-report.txt

      - name: Check import order
        run: poetry run isort --check-only --diff --conda-env spec2vec-dev .

  matchms_compatibility:
    name: matchms ${{ matrix.matchms-version }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.13'
            matchms-version: '0.33.1'
          - python-version: '3.13'
            matchms-version: '1.0.0.dev1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: |
          python -m pip install --upgrade pip poetry
          poetry install

      - name: Install selected matchms version
        run: |
          poetry run python -m pip install --upgrade --pre "matchms==${{ matrix.matchms-version }}"
          poetry run python -m pip check

      - name: Verify matchms version
        run: |
          poetry run python -c "from importlib.metadata import version; actual = version('matchms'); expected = '${{ matrix.matchms-version }}'; print(f'matchms: {actual}'); assert actual == expected, (actual, expected)"

      - name: Focused compatibility tests
        run: poetry run pytest -q tests/test_matchms_api_compat.py

      - name: Full test suite
        run: poetry run pytest

  build_pypi:
    name: PyPI package / Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: first_check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        exclude:
          # Already tested by first_check
          - python-version: '3.13'
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools
        run: python -m pip install --upgrade pip poetry twine

      - name: Build package
        run: poetry build

      - name: Validate distribution
        run: python -m twine check dist/*

      - name: Install development environment
        run: poetry install

      - name: Run tests
        run: poetry run pytest

  # Documentation builds once, independently of the package matrix.
  build_docs:
    name: Documentation / Python 3.13 / Ubuntu
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install project and documentation dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry install
          poetry run python -m pip install -r readthedocs/requirements.txt

      - name: Build HTML documentation
        run: |
          poetry run sphinx-build -n -b html readthedocs readthedocs/_build/html

      - name: Run documentation examples
        run: |
          poetry run sphinx-build -n -b doctest readthedocs readthedocs/_build/doctest

      - name: Check documentation coverage
        run: |
          poetry run sphinx-build -n -b coverage readthedocs readthedocs/_build/coverage

      - name: Check documentation coverage threshold
        shell: bash
        run: |
          REPORT=readthedocs/_build/coverage/python.txt
          cat "$REPORT"

          UNCOVERED_MEMBERS=$(grep -cE '^[[:space:]]*\*' "$REPORT" || true)
          UNCOVERED_MEMBERS_ALLOWED=5

          echo "Undocumented members: ${UNCOVERED_MEMBERS}"
          echo "Allowed: ${UNCOVERED_MEMBERS_ALLOWED}"

          if (( UNCOVERED_MEMBERS > UNCOVERED_MEMBERS_ALLOWED )); then
            echo "::error::Too many undocumented members"
            exit 1
          fi

          echo "Documentation coverage check passed."

  anaconda_build:
    name: Conda package / Python 3.12 / Ubuntu
    runs-on: ubuntu-latest
    needs: first_check

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Create build environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: spec2vec-build
          auto-update-conda: true
          environment-file: conda/environment-build.yml
          python-version: '3.12'
          conda-build-version: '*'

      - name: Show Conda configuration
        shell: bash -l {0}
        run: |
          conda info
          conda list
          conda config --show-sources
          conda env list

      - name: Build Conda package
        shell: bash -l {0}
        run: |
          BUILDDIR="$RUNNER_TEMP/spec2vec/_build"
          conda config --set anaconda_upload no
          conda build --no-include-recipe \
            --channel conda-forge --channel bioconda \
            --croot "$BUILDDIR" \
            ./conda

      - name: Upload Conda package
        uses: actions/upload-artifact@v4
        with:
          name: conda-package-artifact
          path: ${{ runner.temp }}/spec2vec/_build
