name: CI Build

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master
    types: [opened, reopened, synchronize]

  workflow_dispatch:
    inputs:
      tag:
        description: Tag for manually running CI Build workflow
        required: false
        default: ''

# Cancel outdated runs when new commits are pushed to the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  first_check:
    name: first code check / python-3.13 / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python info
        run: |
          python -c "import sys; print(sys.executable)"
          python --version
      - name: Build package and create dev environment
        run: |
          python -m pip install --upgrade pip poetry
          poetry install
      - name: Show pip list
        run: poetry run python -m pip list
      - name: Test with coverage
        run: poetry run pytest --cov --cov-report term --cov-report xml --junitxml=xunit-result.xml
      - name: Correct coverage paths
        run: sed -i "s+$PWD/++g" coverage.xml
      - name: Check style against standards using prospector
        shell: bash -l {0}
        run: poetry run prospector -o grouped -o pylint:pylint-report.txt
      - name: Check whether import statements are used consistently
        shell: bash -l {0}
        run: poetry run isort --check-only --diff --conda-env spec2vec-dev .

  # Explicitly test BOTH the latest matchms 0.x and the 1.0 pre-release.
  # Poetry installs the locked default environment first and pip then replaces
  # matchms with the exact test version, including its required dependencies.
  matchms_compatibility:
    name: matchms ${{ matrix.matchms-version }} / python-${{ matrix.python-version }} / ubuntu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.13'
            matchms-version: '0.33.1'
          - python-version: '3.13'
            matchms-version: '1.0.0.dev1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry and project dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry install
      - name: Install exact matchms version (including pre-releases)
        run: |
          poetry run python -m pip install --upgrade --pre "matchms==${{ matrix.matchms-version }}"
          poetry run python -m pip check
      - name: Verify exact matchms version
        run: |
          poetry run python -c "from importlib.metadata import version; actual = version('matchms'); expected = '${{ matrix.matchms-version }}'; print(f'matchms: {actual}'); assert actual == expected, (actual, expected)"
      - name: Focused cross-version API tests
        run: poetry run pytest -q tests/test_matchms_api_compat.py
      - name: Full test suite with selected matchms
        run: poetry run pytest

  build_pypi:
    name: Pypi and documentation build / python-${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: first_check
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']
        python-version: ['3.10', '3.11', '3.12', '3.13']
        exclude:
          - python-version: '3.13'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python info
        run: |
          python -c "import sys; print(sys.executable)"
          python --version
      - name: Install dependencies
        run: python -m pip install --upgrade pip poetry
      - name: Build package
        run: poetry build
      - name: Test package
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - name: Install dev environment
        run: poetry install
      - name: Show pip list
        run: poetry run python -m pip list
      - name: Test
        run: poetry run pytest
      - name: Build documentation (no GNU Make dependency)
        working-directory: readthedocs/
        run: |
          poetry run sphinx-build -n -b html . _build/html
          poetry run sphinx-build -n -b doctest . _build/doctest
          poetry run sphinx-build -n -b coverage . _build/coverage
      - name: Check documentation coverage threshold
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cat readthedocs/_build/coverage/python.txt
          UNCOVERED_MEMBERS=$(grep '*' readthedocs/_build/coverage/python.txt | wc -l)
          UNCOVERED_MEMBERS_ALLOWED=5
          if (( UNCOVERED_MEMBERS > UNCOVERED_MEMBERS_ALLOWED )); then
            echo "There are ${UNCOVERED_MEMBERS} uncovered members, more than ${UNCOVERED_MEMBERS_ALLOWED} allowed."
            exit 1
          fi
          echo "Documentation check passed: ${UNCOVERED_MEMBERS} uncovered members."

  anaconda_build:
    name: Anaconda build / python-3.12 / ubuntu-latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    needs: first_check
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - name: Create spec2vec-build environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: spec2vec-build
          auto-update-conda: true
          environment-file: conda/environment-build.yml
          python-version: '3.12'
          conda-build-version: "*"
      - name: Show conda config
        shell: bash -l {0}
        run: |
          conda info
          conda list
          conda config --show-sources
          conda config --show
          conda env list
      - name: Python info
        shell: bash -l {0}
        run: |
          which python
          python --version
      - name: Show environment variables
        shell: bash -l {0}
        run: env | sort
      - name: Build the conda package
        shell: bash -l {0}
        run: |
          export BUILDDIR=$RUNNER_TEMP/spec2vec/_build
          [ "$RUNNING_OS" = "Windows" ] && export BUILDDIR=$RUNNER_TEMP\\spec2vec\\_build\\
          conda config --set anaconda_upload no
          conda build --no-include-recipe \
            --channel conda-forge --channel bioconda \
            --croot ${BUILDDIR} \
            ./conda
      - name: Upload package artifact from build
        uses: actions/upload-artifact@v4
        with:
          name: conda-package-artifact
          path: ${{ runner.temp }}/spec2vec/_build
